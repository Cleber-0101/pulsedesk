<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseDesk — Login</title>
<link rel="stylesheet" href="css/index.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

</head>
<body>
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="card">
  <div class="logo">
    <!--<div class="logo-icon">⚡</div>-->
    <div class="logo-text">PulseDesk</div>
  </div>

  <h1>Bem-vindo</h1>
  <p class="sub">Acesse o painel de satisfação</p>

  <div class="tabs">
    <button class="tab active" onclick="setTipo('admin')">Administrador</button>
    <button class="tab" onclick="setTipo('funcionario')">Funcionário</button>
  </div>

  <div class="field">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" />
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()" />
  </div>
  <button class="btn" id="btnLogin" onclick="login()">Entrar</button>

  <div class="erro" id="erro"></div>

  <div class="divider">ou</div>
  <a href="pesquisa.html" class="link-pesquisa">
     Avaliar funcionario
    <span>Acesso público</span>
  </a>
</div>

<script>
  let tipoAtual = 'admin';

  function setTipo(tipo) {
    tipoAtual = tipo;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('erro').style.display = 'none';
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const btn = document.getElementById('btnLogin');
    const erro = document.getElementById('erro');

    if (!email || !senha) {
      erro.textContent = 'Preencha e-mail e senha.';
      erro.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando...';
    erro.style.display = 'none';

    try {
      const res = await fetch(`/api/auth/${tipoAtual}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.erro || 'Erro ao fazer login');

      localStorage.setItem('pd_token', data.token);
      localStorage.setItem('pd_nome', data.nome);
      localStorage.setItem('pd_tipo', data.tipo);

      window.location.href = data.tipo === 'admin' ? 'admin.html' : 'funcionario.html';
    } catch (err) {
      erro.textContent = err.message;
      erro.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  }
</script>
</body>
</html>
